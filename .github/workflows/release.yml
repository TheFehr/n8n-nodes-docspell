name: Release

on:
  push:
    branches:
      - main
  schedule:
    # Off the hour on purpose: everyone's "0 0 * * *" jobs queue at once and run late.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: TheFehr/n8n-node-tooling/.github/workflows/release.yml@6dcd21318149b1856af14c5a2efe36d580c7502d
    with:
      tooling-ref: 6dcd21318149b1856af14c5a2efe36d580c7502d
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
