services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: docspell
      POSTGRES_USER: docspell
      POSTGRES_PASSWORD: docspell
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docspell -d docspell"]
      interval: 2s
      timeout: 3s
      retries: 30

  restserver:
    image: ghcr.io/docspell/restserver:v0.43.0
    ports:
      - "7880:7880"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOCSPELL_SERVER_APP__ID: rest1
      DOCSPELL_SERVER_BIND_ADDRESS: 0.0.0.0
      DOCSPELL_SERVER_INTERNAL__URL: http://restserver:7880
      DOCSPELL_SERVER_BACKEND_SIGNUP_MODE: open
      DOCSPELL_SERVER_BACKEND_JDBC_URL: jdbc:postgresql://db:5432/docspell
      DOCSPELL_SERVER_BACKEND_JDBC_USER: docspell
      DOCSPELL_SERVER_BACKEND_JDBC_PASSWORD: docspell
      DOCSPELL_SERVER_AUTH_SERVER__SECRET: hex:caffee0123456789caffee0123456789caffee0123456789caffee0123456789
      DOCSPELL_SERVER_FULL__TEXT__SEARCH_ENABLED: "false"

  # Processes uploads: items only appear in search results once joex has run.
  joex:
    image: ghcr.io/docspell/joex:v0.43.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOCSPELL_JOEX_APP__ID: joex1
      DOCSPELL_JOEX_BIND_ADDRESS: 0.0.0.0
      DOCSPELL_JOEX_BASE__URL: http://joex:7878
      DOCSPELL_JOEX_SCHEDULER_NAME: joex1
      DOCSPELL_JOEX_PERIODIC__SCHEDULER_NAME: joex1
      DOCSPELL_JOEX_JDBC_URL: jdbc:postgresql://db:5432/docspell
      DOCSPELL_JOEX_JDBC_USER: docspell
      DOCSPELL_JOEX_JDBC_PASSWORD: docspell
      DOCSPELL_JOEX_FULL__TEXT__SEARCH_ENABLED: "false"

  # Not started by `test:up`: scripts/full-test.sh runs it as one-off processes, because
  # `n8n execute` cannot share a container with a running n8n server.
  n8n:
    image: n8nio/n8n:2.45.7
    ports:
      - "5678:5678"
    environment:
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_METRICS_ENABLED=true
      - N8N_TASK_BROKER_PORT=5680
    volumes:
      - .:/home/node/custom-nodes
      - n8n_data:/home/node/.n8n
    depends_on:
      - restserver

volumes:
  n8n_data:
